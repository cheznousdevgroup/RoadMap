<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IA Foot — Dossier Investisseur</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,700;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@300;400;500&display=swap">
<style>
*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; }
body {
  font-family: 'EB Garamond', Georgia, serif;
  background: #2a2016;
  min-height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

/* ── LOCK ── */
#lock {
  min-height: 100vh; width: 100%;
  display: flex; align-items: center; justify-content: center;
  background: radial-gradient(ellipse at 40% 55%, #3a2e1a 0%, #1a140c 70%);
  padding: 2rem;
}
.lock-inner { width: 100%; max-width: 380px; text-align: center; }
.lock-seal {
  width: 72px; height: 72px;
  border: 2px solid #C9A84C; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 1.5rem;
  font-family: 'Playfair Display', serif;
  font-size: 22px; color: #C9A84C; letter-spacing: -1px;
}
.lock-title { font-family: 'Playfair Display', Georgia, serif; font-size: 26px; font-weight: 700; color: #F0EAD6; margin-bottom: 4px; }
.lock-title span { color: #C9A84C; }
.lock-sub { font-family: 'DM Sans', sans-serif; font-size: 11px; color: #8a7a5e; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 2.5rem; }
.lock-card { background: #F7F2E8; border-radius: 4px; padding: 2rem 2rem 2.25rem; box-shadow: 0 8px 40px rgba(0,0,0,0.5), 0 2px 8px rgba(0,0,0,0.3); }
.lock-label { display: block; font-family: 'DM Sans', sans-serif; font-size: 11px; color: #6b5e44; letter-spacing: 0.07em; text-transform: uppercase; text-align: left; margin-bottom: 8px; }
.pw-row { position: relative; margin-bottom: 1rem; }
.pw-row input { width: 100%; background: #fff; border: 1px solid #d4c9b0; border-radius: 3px; padding: 10px 40px 10px 14px; font-size: 14px; font-family: 'DM Sans', sans-serif; color: #2a2016; outline: none; transition: border-color 0.2s; }
.pw-row input:focus { border-color: #C9A84C; }
.pw-eye { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: #8a7a5e; padding: 0; line-height: 0; }
.pw-eye svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.err { font-family: 'DM Sans', sans-serif; font-size: 12px; color: #c0392b; margin-bottom: 10px; display: none; }
.btn-unlock { width: 100%; padding: 11px 14px; background: #C9A84C; color: #1a140c; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 600; border: none; border-radius: 3px; cursor: pointer; letter-spacing: 0.05em; transition: background 0.2s; }
.btn-unlock:hover { background: #d9b85c; }
.lock-conf { font-family: 'DM Sans', sans-serif; font-size: 11px; color: #5a4e38; margin-top: 1.5rem; letter-spacing: 0.05em; }
@keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-6px)} 40%{transform:translateX(6px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(3px)} }
.shake { animation: shake 0.35s ease; }

/* ── BOOK SHELL ── */
#book-shell {
  display: none; flex-direction: column; align-items: center; justify-content: center;
  min-height: 100vh; width: 100%; padding: 2rem 1rem 1rem;
  background: #2a2016;
}
#book-shell::before {
  content: ''; position: fixed; bottom: 0; left: 0; right: 0; height: 6px;
  background: linear-gradient(90deg, #1a140c, #3a2e1a 30%, #1a140c); z-index: 100;
}

/* ── BOOK VIEWER ── */
.book-viewer { position: relative; width: 100%; max-width: 760px; display: flex; justify-content: center; }
.book-shadow { position: absolute; bottom: -16px; left: 50%; transform: translateX(-50%); width: 80%; height: 20px; background: radial-gradient(ellipse, rgba(0,0,0,0.6) 0%, transparent 70%); pointer-events: none; }
.book-spine { position: absolute; left: calc(50% - 6px); top: 0; bottom: 0; width: 12px; background: linear-gradient(180deg, #b8952e, #8a6e1a, #b8952e); box-shadow: -2px 0 6px rgba(0,0,0,0.4), 2px 0 6px rgba(0,0,0,0.4); z-index: 10; }
.page-stack { position: absolute; right: calc(50% + 6px); top: 3px; bottom: 3px; width: 8px; background: repeating-linear-gradient(180deg,#e8e0cc 0px,#d4c9b0 1px,#e8e0cc 2px); opacity: 0.7; }
.page-stack.right-stack { right: auto; left: calc(50% + 6px); }

.book-page {
  width: calc(50% - 6px); min-height: 700px;
  background: #F9F5ED;
  padding: 3.5rem 3rem 3rem;
  position: relative; overflow: hidden;
}
.book-page.left { border-radius: 3px 0 0 3px; box-shadow: -4px 0 12px rgba(0,0,0,0.3), inset -4px 0 12px rgba(0,0,0,0.06); background: linear-gradient(to right, #F2EDE0, #F9F5ED); }
.book-page.right { border-radius: 0 3px 3px 0; box-shadow: 4px 0 12px rgba(0,0,0,0.3), inset 4px 0 12px rgba(0,0,0,0.06); background: linear-gradient(to left, #F2EDE0, #F9F5ED); }
.pg-num { position: absolute; bottom: 1.25rem; font-family: 'DM Sans', sans-serif; font-size: 10px; color: #9a8a6a; letter-spacing: 0.08em; }
.book-page.left .pg-num { left: 3rem; }
.book-page.right .pg-num { right: 3rem; }
.running-head { position: absolute; top: 1.25rem; font-family: 'DM Sans', sans-serif; font-size: 9px; color: #9a8a6a; letter-spacing: 0.12em; text-transform: uppercase; }
.book-page.left .running-head { left: 3rem; }
.book-page.right .running-head { right: 3rem; }
.book-page::before { content: ''; position: absolute; top: 2rem; left: 2rem; right: 2rem; height: 1px; background: linear-gradient(to right, transparent, #C9A84C40, transparent); }

/* ── TYPOGRAPHY ── */
.pg-eyebrow { font-family: 'DM Sans', sans-serif; font-size: 9px; color: #C9A84C; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 500; margin-bottom: 1rem; }
.pg-h1 { font-family: 'Playfair Display', Georgia, serif; font-size: 32px; font-weight: 700; color: #1a140c; line-height: 1.1; letter-spacing: -0.5px; text-wrap: balance; margin-bottom: 0.75rem; }
.pg-h1 em { color: #C9A84C; font-style: normal; }
.pg-h2 { font-family: 'Playfair Display', Georgia, serif; font-size: 20px; font-weight: 500; color: #1a140c; margin-bottom: 0.9rem; text-wrap: balance; border-bottom: 1px solid #d4c9b0; padding-bottom: 0.5rem; }
.pg-lead { font-family: 'EB Garamond', Georgia, serif; font-size: 15px; color: #3a2e1a; line-height: 1.8; margin-bottom: 1rem; }
.pg-lead strong { font-weight: 600; color: #1a140c; }
.pg-body { font-family: 'EB Garamond', Georgia, serif; font-size: 13.5px; color: #4a3e2a; line-height: 1.75; margin-bottom: 0.7rem; }
.pg-body strong { font-weight: 600; color: #2a2016; }
.pg-caption { font-family: 'DM Sans', sans-serif; font-size: 10px; color: #8a7a5e; line-height: 1.5; margin-top: 0.3rem; }
.gold-rule { width: 40px; height: 2px; background: #C9A84C; margin: 1.25rem 0; }

/* cover */
.cover-seal { width: 64px; height: 64px; border: 1.5px solid #C9A84C; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-bottom: 2rem; font-family: 'Playfair Display', serif; font-size: 18px; color: #C9A84C; }
.cover-meta { margin-top: 2rem; padding-top: 1.25rem; border-top: 1px solid #d4c9b0; }
.cover-meta-row { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid #ebe4d0; }
.cover-meta-row:last-child { border-bottom: none; }
.cover-meta-lbl { font-family: 'DM Sans', sans-serif; font-size: 10px; color: #8a7a5e; text-transform: uppercase; letter-spacing: 0.07em; }
.cover-meta-val { font-family: 'DM Sans', sans-serif; font-size: 11px; color: #2a2016; font-weight: 500; }
.cover-right { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; min-height: 700px; }
.cover-stamp { width: 140px; height: 140px; border: 1.5px solid #C9A84C40; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 4px; }
.cover-stamp-year { font-family: 'DM Sans', sans-serif; font-size: 10px; color: #C9A84C; letter-spacing: 0.1em; }
.cover-stamp-main { font-family: 'Playfair Display', serif; font-size: 22px; color: #C9A84C; font-weight: 700; }
.cover-stamp-sub { font-family: 'DM Sans', sans-serif; font-size: 9px; color: #C9A84C80; letter-spacing: 0.08em; text-transform: uppercase; }
.cover-conf { font-family: 'DM Sans', sans-serif; font-size: 9px; color: #b8a880; letter-spacing: 0.1em; text-transform: uppercase; margin-top: 3rem; }

/* kpi */
.kpi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 1rem 0; }
.kpi-cell { background: #F0E9D6; border: 1px solid #d4c9b0; border-radius: 3px; padding: 10px 12px; text-align: center; }
.kpi-v { font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 700; color: #C9A84C; font-variant-numeric: tabular-nums; line-height: 1; }
.kpi-l { font-family: 'DM Sans', sans-serif; font-size: 9px; color: #6b5e44; margin-top: 4px; line-height: 1.3; }

/* table */
.mini-table { width: 100%; border-collapse: collapse; font-size: 11.5px; margin: 0.75rem 0; font-variant-numeric: tabular-nums; }
.mini-table thead th { font-family: 'DM Sans', sans-serif; font-size: 9px; font-weight: 600; color: #8a7a5e; letter-spacing: 0.07em; text-transform: uppercase; border-bottom: 1.5px solid #C9A84C50; padding: 5px 6px; text-align: left; white-space: nowrap; }
.mini-table tbody td { font-family: 'EB Garamond', Georgia, serif; padding: 6px 6px; border-bottom: 1px solid #e8e0cc; color: #4a3e2a; vertical-align: top; line-height: 1.4; }
.mini-table tbody tr:last-child td { border-bottom: none; }
.mini-table tbody td:first-child { color: #2a2016; font-weight: 500; }
.td-gold { color: #a07820 !important; font-weight: 600 !important; }
.td-total { background: #f0e9d6; }
.td-total td { border-bottom: 1px solid #C9A84C40 !important; }

/* hi-box */
.hi-box { background: #F0E9D6; border-left: 3px solid #C9A84C; padding: 0.85rem 1rem; font-family: 'EB Garamond', serif; font-size: 13px; color: #3a2e1a; line-height: 1.7; margin: 0.75rem 0; }
.hi-box strong { color: #8a6018; }

/* budget */
.bdg-row { display: flex; justify-content: space-between; align-items: baseline; padding: 5px 0; border-bottom: 1px solid #e8e0cc; gap: 8px; }
.bdg-row:last-child { border-bottom: none; }
.bdg-name { font-family: 'EB Garamond', serif; font-size: 12px; color: #4a3e2a; flex: 1; line-height: 1.4; }
.bdg-note { font-family: 'DM Sans', sans-serif; font-size: 9px; color: #8a7a5e; display: block; }
.bdg-amt { font-family: 'DM Sans', sans-serif; font-size: 11px; font-weight: 600; color: #2a2016; white-space: nowrap; font-variant-numeric: tabular-nums; }
.bdg-total { display: flex; justify-content: space-between; align-items: baseline; padding: 8px 10px; background: #F0E9D6; border: 1px solid #C9A84C50; border-radius: 2px; margin-top: 6px; }
.bdg-total-lbl { font-family: 'DM Sans', sans-serif; font-size: 11px; font-weight: 600; color: #2a2016; }
.bdg-total-amt { font-family: 'Playfair Display', serif; font-size: 15px; font-weight: 700; color: #C9A84C; font-variant-numeric: tabular-nums; }

/* pill */
.pill { display: inline-block; font-family: 'DM Sans', sans-serif; font-size: 9px; font-weight: 600; padding: 2px 7px; border-radius: 20px; border: 1px solid #C9A84C60; color: #8a6018; letter-spacing: 0.05em; text-transform: uppercase; }

/* stat row */
.st-row { display: flex; justify-content: space-between; align-items: baseline; padding: 5px 0; border-bottom: 1px solid #e8e0cc; }
.st-row:last-child { border-bottom: none; }
.st-lbl { font-family: 'EB Garamond', serif; font-size: 12px; color: #4a3e2a; }
.st-val { font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 600; color: #C9A84C; font-variant-numeric: tabular-nums; }

/* grand total */
.grand-total-box { background: #F0E9D6; border: 1px solid #C9A84C60; border-radius: 3px; padding: 1.25rem; margin-top: 0.75rem; }
.grand-total-lbl { font-family: 'DM Sans', sans-serif; font-size: 11px; font-weight: 600; color: #2a2016; }
.grand-total-amt { font-family: 'Playfair Display', serif; font-size: 26px; font-weight: 700; color: #C9A84C; font-variant-numeric: tabular-nums; display: block; margin-top: 4px; }
.grand-total-sub { font-family: 'DM Sans', sans-serif; font-size: 10px; color: #8a7a5e; margin-top: 4px; }

/* ── NAV ── */
.book-nav { display: flex; align-items: center; gap: 1.5rem; margin-top: 1.5rem; user-select: none; }
.nav-btn { background: #3a2e1a; border: 1px solid #5a4e38; color: #C9A84C; font-family: 'DM Sans', sans-serif; font-size: 13px; padding: 8px 20px; border-radius: 3px; cursor: pointer; transition: background 0.15s, border-color 0.15s; letter-spacing: 0.04em; }
.nav-btn:hover:not(:disabled) { background: #4a3e28; border-color: #C9A84C80; }
.nav-btn:disabled { opacity: 0.3; cursor: default; }
.nav-info { font-family: 'DM Sans', sans-serif; font-size: 11px; color: #8a7a5e; letter-spacing: 0.06em; min-width: 80px; text-align: center; }
.nav-dots { display: flex; gap: 6px; }
.nav-dot { width: 6px; height: 6px; border-radius: 50%; background: #5a4e38; cursor: pointer; transition: background 0.15s; }
.nav-dot.active { background: #C9A84C; }

/* ── Page turn animation ── */
.book-spread { display: flex; width: 100%; position: relative; }
@keyframes turnLeft { 0%{opacity:1;transform:perspective(1200px) rotateY(0deg)} 100%{opacity:0;transform:perspective(1200px) rotateY(-12deg)} }
@keyframes turnRight { 0%{opacity:1;transform:perspective(1200px) rotateY(0deg)} 100%{opacity:0;transform:perspective(1200px) rotateY(12deg)} }
.turning-left .book-page.right { animation: turnLeft 0.28s ease forwards; }
.turning-right .book-page.left { animation: turnRight 0.28s ease forwards; }

/* ── Mobile ── */
@media (max-width: 680px) {
  .book-page { width: 100%; min-height: unset; padding: 2.5rem 1.5rem 2.5rem; }
  .book-page.left { border-radius: 3px 3px 0 0; box-shadow: none; }
  .book-page.right { border-radius: 0 0 3px 3px; box-shadow: none; display: block !important; }
  .book-spread { flex-direction: column; }
  .book-spine, .page-stack, .book-shadow { display: none; }
  .cover-right { min-height: 200px; padding: 2rem 0; }
  .kpi-grid { grid-template-columns: 1fr 1fr; }
}
</style>
</head>
<body>

<!-- LOCK -->
<div id="lock">
  <div class="lock-inner">
    <div class="lock-seal">IF</div>
    <div class="lock-title">IA <span>FOOT</span></div>
    <div class="lock-sub">Dossier investisseur · Confidentiel</div>
    <div class="lock-card">
      <label class="lock-label" for="pw">Mot de passe d'accès</label>
      <div class="pw-row" id="pw-row">
        <input type="password" id="pw" placeholder="••••••••••" autocomplete="off" />
        <button class="pw-eye" onclick="toggleEye()" type="button" aria-label="Afficher">
          <svg id="eye" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <div class="err" id="err">Mot de passe incorrect.</div>
      <button class="btn-unlock" onclick="unlock()">Ouvrir le dossier</button>
    </div>
    <div class="lock-conf">Document confidentiel — circulation restreinte</div>
  </div>
</div>

<!-- BOOK -->
<div id="book-shell">
  <div class="book-viewer">
    <div class="book-shadow"></div>
    <div class="book-spread" id="spread">
      <div class="book-page left" id="page-left"></div>
      <div class="book-spine"></div>
      <div class="page-stack"></div>
      <div class="page-stack right-stack"></div>
      <div class="book-page right" id="page-right"></div>
    </div>
  </div>
  <div class="book-nav">
    <button class="nav-btn" id="btn-prev" onclick="prevSpread()">← Précédent</button>
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
      <div class="nav-info" id="nav-info"></div>
      <div class="nav-dots" id="nav-dots"></div>
    </div>
    <button class="nav-btn" id="btn-next" onclick="nextSpread()">Suivant →</button>
  </div>
</div>

<script>
const CORRECT = 'Merci2026';

const spreads = [

[`<div class="running-head">IA Foot</div>
<div class="cover-seal">IF</div>
<div class="pg-eyebrow">Dossier Investisseur · Septembre 2026</div>
<div class="pg-h1">La plateforme IA qui <em>démocratise</em> l'analyse sportive</div>
<div class="gold-rule"></div>
<div class="pg-body">Moteur de pronostics footballistiques multi-agents déjà en production — 4 LLM en parallèle, Monte Carlo, ELO — qui cherche des actionnaires pour dominer l'Afrique et l'Europe.</div>
<div class="cover-meta">
  <div class="cover-meta-row"><span class="cover-meta-lbl">Fondé</span><span class="cover-meta-val">2025</span></div>
  <div class="cover-meta-row"><span class="cover-meta-lbl">Statut</span><span class="cover-meta-val">En production</span></div>
  <div class="cover-meta-row"><span class="cover-meta-lbl">Marché cible</span><span class="cover-meta-val">Afrique de l'Ouest + Europe</span></div>
  <div class="cover-meta-row"><span class="cover-meta-lbl">Horizon</span><span class="cover-meta-val">2026 – 2029</span></div>
  <div class="cover-meta-row"><span class="cover-meta-lbl">Levée demandée</span><span class="cover-meta-val" style="color:#C9A84C;font-family:'Playfair Display',serif;font-size:13px;">186 626 616 FCFA</span></div>
</div>
<div class="pg-num">1</div>`,

`<div class="cover-right">
  <div class="cover-stamp">
    <div class="cover-stamp-year">Depuis 2025</div>
    <div class="cover-stamp-main">IA<br>FOOT</div>
    <div class="cover-stamp-sub">Intelligence Artificielle</div>
  </div>
  <div class="cover-conf">Document confidentiel</div>
</div>
<div class="pg-num" style="right:3rem;">2</div>`],

[`<div class="running-head">Métriques actuelles</div>
<div class="pg-eyebrow">01 · Le produit en chiffres</div>
<div class="pg-h2">Performances en production réelle</div>
<div class="pg-body">Ces chiffres sont mesurés en production, pas en simulation. Le moteur tourne quotidiennement depuis 2025.</div>
<div class="kpi-grid">
  <div class="kpi-cell"><div class="kpi-v">60%</div><div class="kpi-l">Taux de réussite (7j glissants)</div></div>
  <div class="kpi-cell"><div class="kpi-v">198</div><div class="kpi-l">Pronostics générés / jour</div></div>
  <div class="kpi-cell"><div class="kpi-v">4 LLM</div><div class="kpi-l">Experts IA en parallèle</div></div>
  <div class="kpi-cell"><div class="kpi-v">10 000</div><div class="kpi-l">Simulations Monte Carlo / match</div></div>
  <div class="kpi-cell"><div class="kpi-v">50+</div><div class="kpi-l">Ligues couvertes aujourd'hui</div></div>
  <div class="kpi-cell"><div class="kpi-v">0 CFA</div><div class="kpi-l">Coût d'entrée utilisateur</div></div>
</div>
<div class="hi-box"><strong>Déjà en production.</strong> Nous ne vendons pas une idée — nous cherchons des partenaires pour passer d'un produit qui fonctionne à une plateforme qui domine.</div>
<div class="pg-num">3</div>`,

`<div class="running-head">Executive Summary</div>
<div class="pg-eyebrow">01 · Executive Summary</div>
<div class="pg-h2">Ce que nous construisons</div>
<div class="pg-body"><strong>Le produit :</strong> Moteur IA multi-agents qui analyse des centaines de matchs par jour et publie des pronostics vérifiables avec historique transparent.</div>
<div class="pg-body"><strong>Le modèle économique :</strong> Freemium + publicité vidéo. Chaque utilisateur gratuit regarde une pub pour débloquer un pronostic. Les utilisateurs premium paient un abonnement mensuel. Double flux de revenus dès le jour 1.</div>
<div class="pg-body"><strong>L'opportunité :</strong> Le marché africain des paris sportifs croît de <strong>+18% par an</strong>. 90% des tipsters n'ont aucun historique vérifiable. IA Foot apporte la preuve mathématique là où il n'y a que des opinions.</div>
<div class="pg-body"><strong>La demande :</strong> Levée d'amorçage pour financer 18 mois — infrastructure cloud, API sportives, marketing d'acquisition, développement mobile.</div>
<div class="pg-num" style="right:3rem;">4</div>`],

[`<div class="running-head">Le Problème</div>
<div class="pg-eyebrow">02 · Problème & Opportunité</div>
<div class="pg-h2">Des milliards misés, zéro transparence</div>
<div class="pg-body">Le parieur sportif en Afrique de l'Ouest mise en aveugle. Les tipsters vendent de la confiance, pas de la donnée. Résultat : 80% des parieurs perdent à long terme — non par malchance, mais par manque d'information structurée.</div>
<table class="mini-table">
<thead><tr><th>Problème</th><th>Solution IA Foot</th></tr></thead>
<tbody>
  <tr><td>90% tipsters sans historique</td><td>Historique public archivé</td></tr>

/* ── State ── */
let current = 0;

function _paint(idx) {
  const [l, r] = spreads[idx];
  document.getElementById('page-left').innerHTML = l;
  document.getElementById('page-right').innerHTML = r;
  document.getElementById('nav-info').textContent = 'Pages ' + (idx*2+1) + '–' + (idx*2+2);
  document.getElementById('btn-prev').disabled = idx === 0;
  document.getElementById('btn-next').disabled = idx === spreads.length - 1;
  document.querySelectorAll('.nav-dot').forEach((d,i) => d.classList.toggle('active', i===idx));
}

function renderSpread(idx, dir) {
  const spread = document.getElementById('spread');
  if (dir) {
    spread.classList.add('turning-' + dir);
    setTimeout(() => { spread.classList.remove('turning-left','turning-right'); _paint(idx); }, 260);
  } else {
    _paint(idx);
  }
}

function nextSpread() { if (current < spreads.length-1) { current++; renderSpread(current,'left'); } }
function prevSpread() { if (current > 0) { current--; renderSpread(current,'right'); } }

document.addEventListener('keydown', e => {
  if (!document.getElementById('book-shell').style.display || document.getElementById('book-shell').style.display === 'none') return;
  if (e.key==='ArrowRight'||e.key==='ArrowDown') nextSpread();
  if (e.key==='ArrowLeft'||e.key==='ArrowUp') prevSpread();
});

/* ── Lock ── */
function toggleEye() {
  const inp = document.getElementById('pw'), eye = document.getElementById('eye');
  if (inp.type==='password') { inp.type='text'; eye.innerHTML='<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>'; }
  else { inp.type='password'; eye.innerHTML='<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>'; }
}

function unlock() {
  const val = document.getElementById('pw').value;
  const err = document.getElementById('err'), row = document.getElementById('pw-row');
  if (val === CORRECT) {
    document.getElementById('lock').style.display = 'none';
    const shell = document.getElementById('book-shell');
    shell.style.display = 'flex';
    const dotsEl = document.getElementById('nav-dots');
    spreads.forEach((_,i) => {
      const d = document.createElement('div');
      d.className = 'nav-dot' + (i===0?' active':'');
      d.onclick = () => { current=i; renderSpread(i,null); };
      dotsEl.appendChild(d);
    });
    renderSpread(0, null);
  } else {
    err.style.display = 'block';
    row.classList.remove('shake'); void row.offsetWidth; row.classList.add('shake');
    document.getElementById('pw').value = '';
  }
}

document.getElementById('pw').addEventListener('keydown', e => { if (e.key==='Enter') unlock(); });
</script>
